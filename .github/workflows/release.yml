name: Release

on:
  push:
    branches: [main]
  release:
    types: [published]

permissions:
  contents: write

env:
  RELEASE_ASSET_NAME: codex-usage.exe

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - name: Build release binary
        run: |
          cargo test --release --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo build --release --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Prepare release assets
        shell: pwsh
        run: .\scripts\package.ps1

      - name: Create GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/codex-usage.exe
            dist/codex-usage.exe.sha256
            dist/install.ps1
            dist/uninstall.ps1
            dist/install.cmd
            dist/*.zip
            dist/*.zip.sha256
          generate_release_notes: true

      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push'
        with:
          name: windows-downloads
          path: |
            dist/*.exe
            dist/*.cmd
            dist/*.ps1
            dist/*.sha256
            dist/*.zip
          if-no-files-found: error

  macos:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: macos
    steps:
      - uses: actions/checkout@v4
      - name: Build macOS app
        run: bash scripts/build_app.sh
      - name: Test quota reading and multilingual menu
        run: |
          bash scripts/test_quota_reader.sh
          bash scripts/test_menubar.sh
      - name: Package macOS app
        run: |
          bash -n scripts/install.command scripts/package.sh
          bash scripts/package.sh
          codesign --verify --deep --strict build/CodexVisual.app
      - name: Attach macOS downloads
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            macos/build/codex-usage-compact-*.zip
            macos/build/codex-usage-compact-*.zip.sha256

      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push'
        with:
          name: macos-${{ matrix.runner }}-downloads
          path: |
            macos/build/codex-usage-compact-*.zip
            macos/build/codex-usage-compact-*.zip.sha256
          if-no-files-found: error

  publish:
    if: github.event_name == 'push' && startsWith(github.event.head_commit.message, 'Release v')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: downloads
          merge-multiple: true
      - name: Publish the verified packages together
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1 | tr -d '\r')
          gh release create "v$VERSION" --target "$GITHUB_SHA" --title "v$VERSION — Windows + macOS · 中文 / 日本語 / English" --notes-file docs/release-notes.md downloads/*.exe downloads/*.cmd downloads/*.ps1 downloads/*.sha256 downloads/*.zip

